plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "net.minecrell.plugin-yml.bungee" version "0.6.0"
}

group 'com.minecraft.core.proxy'
version '1.5.7-SNAPSHOT'

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven {
        name 'm2-dv8tion'
        url 'https://m2.dv8tion.net/releases'
    }
}

dependencies {
    compile project(':core')

    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'
    implementation 'com.github.robinbraemer:cloudflareapi:1.4.0'
    implementation 'org.twitter4j:twitter4j-core:4.0.7'

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    implementation('net.dv8tion:JDA:5.2.1') {
        exclude module: 'opus-java'
    }
    implementation 'org.slf4j:slf4j-nop:1.7.36'

    implementation('club.minnced:discord-webhooks:0.7.4')

    implementation group: 'redis.clients', name: 'jedis', version: '2.9.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'

    compileOnly name: 'proxy-server'
    compileOnly fileTree(dir: "${rootDir}/libs", include: ['*.jar'])

    testImplementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}

tasks.register("Ateu", Copy) {
    dependsOn shadowJarTask
    from shadowJarTask.outputs.files
    into "/home/NesquikDeveloper/AteuMC/updater"
}

shadowJar {
    dependencies {
        include(project(':core-bukkit'))
    }
    archiveClassifier = null
}