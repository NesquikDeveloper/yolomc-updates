plugins {
    id 'java-library'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group 'com.minecraft.core.bukkit'
version '1.0.0-SNAPSHOT'

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://hub.spigotmc.org/nexus/content/groups/public/" }
    maven {
        name 'm2-dv8tion'
        url 'https://m2.dv8tion.net/releases'
    }
    flatDir {
        dirs "${rootDir}/libs"
    }
}

dependencies {
    api project(':core')

    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    api group: 'redis.clients', name: 'jedis', version: '2.9.0'

    compileOnly name: 'bukkit-server'
    compileOnly name: 'ViaVersion'
    compileOnly fileTree(dir: "${rootDir}/libs", include: ['*.jar'])

    api 'org.atteo.classindex:classindex:3.9'
    api 'it.unimi.dsi:fastutil:8.3.0'
    api('net.dv8tion:JDA:5.2.1') {
        exclude module: 'opus-java'
    }

    testImplementation group: 'junit', name: 'junit', version: '4.12'

}
